services:
  postgres:
    image: postgres:16-alpine
    container_name: ltm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ltm_user
      POSTGRES_PASSWORD: ltm_dev_secret
      POSTGRES_DB: ltm_db
    ports:
      - "5432:5432"
    volumes:
      - ltm_pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltm_user -d ltm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ltm_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ltm_redis_secret
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ltm_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ltm_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Optional local observability ---
  # Uncomment to spin up Adminer (DB GUI) on http://localhost:8080
  # adminer:
  #   image: adminer:latest
  #   container_name: ltm_adminer
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  ltm_pgdata:
    driver: local
  ltm_redisdata:
    driver: local
